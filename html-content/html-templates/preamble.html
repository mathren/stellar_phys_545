<!-- toggle drawers -->
<script>
  window.onload = () => {
      const toggleButton = document.getElementById("light-dark-toggle");
      const body = document.body;
      const html = document.documentElement;


      // Check localStorage for user preference
      if (localStorage.getItem("theme") === "dark") {
          body.classList.add("dark-mode");
	  html.classList.toggle("dark-mode");
      }

      // Toggle theme on click
      toggleButton.addEventListener("click", () => {
          body.classList.toggle("dark-mode");
  html.classList.toggle("dark-mode");

          // Save user preference
          if (body.classList.contains("dark-mode")) {
              localStorage.setItem("theme", "dark");
          } else {
              localStorage.setItem("theme", "light");
          }
      });
  };
</script>

<!-- jump to nearest date in lectures.html -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const headers = [...document.querySelectorAll("h1, h2, h3, h4, h5, h6")];
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  let closest = null;
  let closestDiff = Infinity;

  for (const h of headers) {
    const ts = h.querySelector("span.timestamp");
    if (!ts) continue;

    // Extract "2026-01-21" from "2026-01-21 Wed "
    const match = ts.textContent.match(/(\d{4}-\d{2}-\d{2})/);
    if (!match) continue;

    const parsed = new Date(match[1] + "T00:00:00"); // force local time, avoid UTC shift
    const diff = Math.abs(parsed - today);

    if (diff < closestDiff) {
      closestDiff = diff;
      closest = h;
    }
  }

  if (closest) closest.scrollIntoView({ behavior: "smooth", block: "start" });
});
</script>
